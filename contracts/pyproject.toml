[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "portscanner-contracts"
version = "0.1.0"
description = "Typed public data contracts for Portscanner"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Roblox" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11,<3",
]

[project.urls]
Repository = "https://github.com/Roblox/portscanner"

[tool.hatch.build.targets.wheel]
packages = ["src/portscanner_contracts"]
