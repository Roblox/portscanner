[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portscanner-processor"
version = "1.0.0"
description = "Scheduled ACT finding reconciliation and export"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "awslambdaric>=4,<5",
    "portscanner-parser",
    "boto3",
    "psycopg[binary]",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.uv.sources]
portscanner-parser = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = [
    "integration: requires TEST_DATABASE_URL",
]
