[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "portscanner-generator"
version = "1.0.0"
description = "Freshness-gated TargetEvent dispatcher for Scanner resources"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "awslambdaric>=4,<5",
  "boto3>=1.35",
  "kubernetes",
  "portscanner-contracts>=1.0.0",
  "portscanner-inventory>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/portscanner_generator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
