[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "portscanner-generator"
version = "0.1.0"
description = "Freshness-gated TargetEvent dispatcher for Scanner resources"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "boto3>=1.35",
  "kubernetes",
  "portscanner-contracts>=0.1.0",
  "portscanner-inventory>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/portscanner_generator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
