version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /operator
    schedule:
      interval: weekly
      day: monday
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: terraform
    directories:
      - /terraform/aws/examples/created-vpc
      - /terraform/aws/examples/existing-vpc
      - /terraform/aws/examples/member-account
      - /terraform/aws/examples/multi-account-central
      - /terraform/aws/state-bootstrap
    schedule:
      interval: weekly
      day: monday
    groups:
      terraform-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /db/migrator
      - /generator
      - /inventory
      - /operator
      - /parser
      - /processor
      - /scanner/nmap
    schedule:
      interval: weekly
      day: monday
    groups:
      containers-minor-patch:
        update-types:
          - minor
          - patch
