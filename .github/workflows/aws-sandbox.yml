name: AWS sandbox (manual)

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the configured sandbox after environment approval
        required: true
        type: boolean
        default: false
      authorization_confirmed:
        description: Confirm written authorization and provider-policy review
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-sandbox
  cancel-in-progress: false

jobs:
  sandbox:
    name: Approval-protected sandbox
    if: >-
      inputs.run_live &&
      inputs.authorization_confirmed &&
      vars.AWS_SANDBOX_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: aws-sandbox
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate protected configuration
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_SANDBOX_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_SANDBOX_REGION }}
          ROLE_REFERENCE: ${{ vars.AWS_SANDBOX_ROLE_ARN }}
          TF_ROOT: ${{ vars.AWS_TERRAFORM_ROOT }}
          TFVARS_JSON: ${{ secrets.AWS_SANDBOX_TFVARS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPECTED_ACCOUNT}"
          test -n "${REGION}"
          test -n "${ROLE_REFERENCE}"
          test -n "${TF_ROOT}"
          test -n "${TFVARS_JSON}"
          [[ "${EXPECTED_ACCOUNT}" =~ ^[0-9]{12}$ ]]
          [[ "${REGION}" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "${TF_ROOT}" =~ ^[A-Za-z0-9_./-]+$ ]]
          [[ "${TF_ROOT}" != /* ]]
          [[ "${TF_ROOT}" != *".."* ]]
          test -f "${TF_ROOT}/main.tf"
          jq -e '.force_destroy_buckets == true' <<<"${TFVARS_JSON}" >/dev/null
          echo "Protected sandbox configuration is present."

      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_SANDBOX_ROLE_ARN }}
          role-session-name: portscanner-sandbox-${{ github.run_id }}
          aws-region: ${{ vars.AWS_SANDBOX_REGION }}
          allowed-account-ids: ${{ vars.AWS_SANDBOX_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true
          output-credentials: false

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.7.4"

      - name: Prepare isolated local state
        env:
          TF_ROOT: ${{ vars.AWS_TERRAFORM_ROOT }}
          TFVARS_JSON: ${{ secrets.AWS_SANDBOX_TFVARS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${TFVARS_JSON}" > "${RUNNER_TEMP}/sandbox.tfvars.json"
          chmod 600 "${RUNNER_TEMP}/sandbox.tfvars.json"
          terraform -chdir="${TF_ROOT}" init -backend=false -input=false -no-color
          touch "${RUNNER_TEMP}/sandbox-initialized"

      - name: Plan with dispatch disabled
        env:
          AWS_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_SANDBOX_ACCOUNT_ID }}
          AWS_SANDBOX_REGION: ${{ vars.AWS_SANDBOX_REGION }}
          TF_ROOT: ${{ vars.AWS_TERRAFORM_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${TF_ROOT}" plan \
            -input=false \
            -no-color \
            -state="${RUNNER_TEMP}/sandbox.tfstate" \
            -var-file="${RUNNER_TEMP}/sandbox.tfvars.json" \
            -var="aws_region=${AWS_SANDBOX_REGION}" \
            -var="expected_deployment_account_id=${AWS_SANDBOX_ACCOUNT_ID}" \
            -var='deploy_runtime=false' \
            -var='run_migration=false' \
            -var='install_operator=false' \
            -var='enable_event_dispatch=false' \
            -var='enable_automatic_inventory=false' \
            -var='canary_mode=false' \
            -out="${RUNNER_TEMP}/sandbox.plan"

      - name: Apply bounded sandbox
        env:
          TF_ROOT: ${{ vars.AWS_TERRAFORM_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 45m terraform -chdir="${TF_ROOT}" apply \
            -input=false \
            -no-color \
            -state="${RUNNER_TEMP}/sandbox.tfstate" \
            "${RUNNER_TEMP}/sandbox.plan"
          touch "${RUNNER_TEMP}/sandbox-applied"

      - name: Run non-scanning smoke checks
        env:
          TF_ROOT: ${{ vars.AWS_TERRAFORM_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "${RUNNER_TEMP}/sandbox-applied"
          terraform -chdir="${TF_ROOT}" output \
            -state="${RUNNER_TEMP}/sandbox.tfstate" \
            -json > /dev/null
          echo "Sandbox applied with dispatch disabled; no network scan was run."

      - name: Destroy sandbox resources
        if: always()
        env:
          AWS_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_SANDBOX_ACCOUNT_ID }}
          AWS_SANDBOX_REGION: ${{ vars.AWS_SANDBOX_REGION }}
          TF_ROOT: ${{ vars.AWS_TERRAFORM_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${RUNNER_TEMP}/sandbox-initialized" ]]; then
            echo "Terraform was not initialized; no Terraform resources were created."
            exit 0
          fi
          timeout 45m terraform -chdir="${TF_ROOT}" destroy \
            -auto-approve \
            -input=false \
            -no-color \
            -state="${RUNNER_TEMP}/sandbox.tfstate" \
            -var-file="${RUNNER_TEMP}/sandbox.tfvars.json" \
            -var="aws_region=${AWS_SANDBOX_REGION}" \
            -var="expected_deployment_account_id=${AWS_SANDBOX_ACCOUNT_ID}" \
            -var='deploy_runtime=false' \
            -var='run_migration=false' \
            -var='install_operator=false' \
            -var='enable_event_dispatch=false' \
            -var='enable_automatic_inventory=false' \
            -var='canary_mode=false'

      - name: Verify cleanup
        if: always()
        env:
          TF_ROOT: ${{ vars.AWS_TERRAFORM_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${RUNNER_TEMP}/sandbox.tfstate" ]]; then
            exit 0
          fi
          if [[ -n "$(terraform -chdir="${TF_ROOT}" state list \
            -state="${RUNNER_TEMP}/sandbox.tfstate")" ]]; then
            echo "Sandbox state still contains resources." >&2
            exit 1
          fi
          rm -f \
            "${RUNNER_TEMP}/sandbox.plan" \
            "${RUNNER_TEMP}/sandbox.tfstate" \
            "${RUNNER_TEMP}/sandbox.tfstate.backup" \
            "${RUNNER_TEMP}/sandbox.tfvars.json"
          echo "Sandbox cleanup verified."
