name: Containers

on:
  pull_request:
    paths:
      - "**/Dockerfile"
      - "**/*.dockerfile"
      - ".dockerignore"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "contracts/**"
      - "db/migrations/**"
      - "db/migrator/**"
      - "generator/**"
      - "inventory/**"
      - "operator/**"
      - "parser/**"
      - "processor/**"
      - "scanner/**"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/go.mod"
      - "**/go.sum"
      - "pyproject.toml"
      - "uv.lock"
      - "tools/build_tracked_image.py"
      - "tools/export_runtime_requirements.py"
      - "tools/verify_python_image.py"
      - ".github/workflows/containers.yml"
  push:
    branches:
      - main
    paths:
      - "**/Dockerfile"
      - "**/*.dockerfile"
      - ".dockerignore"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "contracts/**"
      - "db/migrations/**"
      - "db/migrator/**"
      - "generator/**"
      - "inventory/**"
      - "operator/**"
      - "parser/**"
      - "processor/**"
      - "scanner/**"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/go.mod"
      - "**/go.sum"
      - "pyproject.toml"
      - "uv.lock"
      - "tools/build_tracked_image.py"
      - "tools/export_runtime_requirements.py"
      - "tools/verify_python_image.py"
      - ".github/workflows/containers.yml"

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      present: ${{ steps.matrix.outputs.present }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: matrix
        name: Build a safe matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          output = subprocess.check_output(
              ["git", "ls-files", "Dockerfile", "**/Dockerfile", "**/*.dockerfile"],
              text=True,
          )
          component_contexts = {
              "operator/Dockerfile": "operator",
              "scanner/nmap/Dockerfile": ".",
          }
          python_images = {
              "db/migrator/Dockerfile": (
                  "db/migrator/requirements-runtime.txt",
                  "portscanner-migrator",
                  "act_migrator.handler.lambda_handler",
              ),
              "generator/Dockerfile": (
                  "generator/requirements-runtime.txt",
                  "portscanner-contracts portscanner-inventory portscanner-generator",
                  "portscanner_generator.handler.lambda_handler",
              ),
              "inventory/Dockerfile": (
                  "inventory/requirements-runtime.txt",
                  "portscanner-contracts portscanner-inventory",
                  "portscanner_inventory.handlers.snapshot.lambda_handler "
                  "portscanner_inventory.handlers.signals.lambda_handler "
                  "portscanner_inventory.handlers.outbox.lambda_handler "
                  "portscanner_inventory.handlers.rescan.lambda_handler",
              ),
              "parser/Dockerfile": (
                  "parser/requirements-runtime.txt",
                  "portscanner-contracts portscanner-parser",
                  "act_parser.target_handler.lambda_handler "
                  "act_parser.handler.lambda_handler",
              ),
              "processor/Dockerfile": (
                  "processor/requirements-runtime.txt",
                  "portscanner-contracts portscanner-parser portscanner-processor",
                  "act_processor.handler.lambda_handler",
              ),
              "scanner/nmap/Dockerfile": (
                  "scanner/nmap/requirements-runtime.txt",
                  "portscanner-contracts portscanner-scanner",
                  "",
              ),
          }
          architectures = (
              ("amd64", "ubuntu-latest"),
              ("arm64", "ubuntu-24.04-arm"),
          )
          entries = []
          for index, dockerfile in enumerate(sorted(set(output.splitlines()))):
              if not re.fullmatch(r"[A-Za-z0-9_./-]+", dockerfile):
                  raise SystemExit(f"unsafe Dockerfile path: {dockerfile!r}")
              context = component_contexts.get(dockerfile, ".")
              requirements, distributions, handlers = python_images.get(
                  dockerfile, ("", "", "")
              )
              for architecture, runner in architectures:
                  entries.append(
                      {
                          "dockerfile": dockerfile,
                          "context": context,
                          "image": f"portscanner-ci:component-{index}-{architecture}",
                          "runtime_requirements": requirements,
                          "distributions": distributions,
                          "handlers": handlers,
                          "architecture": architecture,
                          "runner": runner,
                      }
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(
                  "matrix="
                  + json.dumps({"include": entries}, separators=(",", ":"))
                  + "\n"
              )
              handle.write(f"present={'true' if entries else 'false'}\n")
          PY

  build-and-scan:
    name: Build and scan ${{ matrix.dockerfile }} (${{ matrix.architecture }})
    needs:
      - discover
    if: needs.discover.outputs.present == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build image
        env:
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_tracked_image.py \
            --dockerfile "${DOCKERFILE}" \
            --context "${BUILD_CONTEXT}" \
            --tag "${IMAGE}"

      - name: Verify Python runtime lock and licenses
        if: matrix.runtime_requirements != ''
        env:
          DISTRIBUTIONS: ${{ matrix.distributions }}
          HANDLERS: ${{ matrix.handlers }}
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=()
          for distribution in ${DISTRIBUTIONS}; do
            arguments+=(--distribution "${distribution}")
          done
          for handler in ${HANDLERS}; do
            arguments+=(--handler "${handler}")
          done
          python3 tools/verify_python_image.py "${IMAGE}" "${arguments[@]}"

      - name: Verify operator binary startup
        if: matrix.dockerfile == 'operator/Dockerfile'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --network none \
            --user 65532:65532 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            "${IMAGE}" --help

      - name: Verify non-root scanner TCP connect scan
        if: matrix.dockerfile == 'scanner/nmap/Dockerfile'
        env:
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --interactive \
            --network none \
            --user 65532:65532 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --entrypoint python \
            "${IMAGE}" - <scanner/nmap/tests/test_nmap_connect_smoke.py

      - name: Scan image with Trivy
        env:
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image \
            --scanners vuln \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --no-progress \
            "${IMAGE}"
