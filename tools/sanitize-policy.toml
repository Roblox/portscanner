version = 1
max_text_bytes = 2097152
max_binary_bytes = 524288

# Binary files are denied by default. An intentionally distributable binary must be
# reviewed and listed as an exact repository-relative path plus lowercase SHA-256:
# { path = "docs/example.png", sha256 = "<64 lowercase hex characters>" }
binary_allowlist = []

# These are the only account-shaped fixtures accepted in fixture-scoped paths.
synthetic_account_ids = ["000000000000", "123456789012", "222222222222"]

# Live-looking cloud identifiers are allowed only when both the path and exact value
# match this fixture policy. New values require explicit review.
synthetic_fixture_paths = [
  ".gitleaks.toml",
  "**/tests/**",
  "operator/**/*_test.go",
  "operator/config/samples/**",
  "docs/**",
  "examples/**",
  "terraform/aws/**/*.tftest.hcl",
  "terraform/aws/examples/**",
  "tools/sanitize-policy.toml",
]
