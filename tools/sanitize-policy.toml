documentation_ipv4_networks = [
  "192.0.2.0/24",
  "198.51.100.0/24",
  "203.0.113.0/24",
]
documentation_ipv6_networks = ["2001:db8::/32"]

# Denylist-definition files necessarily contain forbidden patterns. Only internal-term
# matching is suppressed for these exact files. The sanitizer policy's exact synthetic
# cloud values are separately path-scoped above; path, size, symlink, address, and PII
# checks still apply.
deny_term_definition_paths = [
  ".gitleaks.toml",
  ".gitignore",
  "tools/sanitize-policy.toml",
]

forbidden_path_globs = [
  "*.tfstate",
  "*.tfstate.*",
  "*.tfvars",
  "*.tfvars.json",
  "*.auto.tfvars",
  "*.tfplan",
  "*.plan",
  "*.pem",
  "*.key",
  "*.p12",
  "*.pfx",
  "*.pptx",
  "*.kubeconfig",
  "*kubeconfig*",
  "kubeconfig",
  "id_dsa",
  "id_ecdsa",
  "id_xmss",
  "id_rsa",
  "id_ed25519",
  "**/.kube/config",
  ".env",
  ".env.*",
]

binary_extensions = [
  ".7z",
  ".avi",
  ".bmp",
  ".class",
  ".dmg",
  ".doc",
  ".docx",
  ".exe",
  ".gif",
  ".gz",
  ".ico",
  ".jar",
  ".jpeg",
  ".jpg",
  ".mov",
  ".mp3",
  ".mp4",
  ".o",
  ".pdf",
  ".png",
  ".so",
  ".tar",
  ".tgz",
  ".webp",
  ".xls",
  ".xlsx",
  ".zip",
]

[[deny_terms]]
id = "internal-domain"
pattern = '''(?i)\b(?:[a-z0-9-]+\.)+(?:corp|internal|intranet|private|local)\b'''
allow_paths = []
allow_patterns = []

[[deny_terms]]
id = "internal-domain-alias"
pattern = '''(?i)\b(?:rbx\.com|rbxcdn\.com|roblox\.local)\b'''
allow_paths = []
allow_patterns = []

[[deny_terms]]
id = "internal-project-term"
pattern = '''(?i)\b(?:netsec|security-tools)\b'''
allow_paths = []
allow_patterns = []

[[deny_terms]]
id = "public-owner-name"
pattern = '''(?i)\broblox\b'''
allow_paths = [
  "LICENSE",
  "NOTICE",
  "NOTICE.md",
  "LICENSES/**",
  "THIRD_PARTY_NOTICES.md",
  "**/LICENSE",
  "**/NOTICE",
  "**/NOTICE.md",
]
allow_patterns = [
  '''(?:https://)?github\.com/Roblox/portscanner(?:/[A-Za-z0-9._~/%#?=:+-]*)?''',
  '''SPDX-FileCopyrightText\s*[:=]\s*"?2026 Roblox(?: Corporation)?"?''',
  '''Copyright:?\s*2026 Roblox(?: Corporation)?''',
  '''authors\s*=\s*\[\{\s*name\s*=\s*"Roblox"\s*\}\]''',
  '''https://raw\.githubusercontent\.com/Roblox/portscanner(?:/[A-Za-z0-9._~/%#?=:+-]*)?''',
]
